name: Deploy Modal worker

on:
  workflow_dispatch:
  push:
    branches: [develop/v3-cloud]
    paths: [.github/workflows/modal-deploy.yml, cloud/requirements.txt]

concurrency:
  group: modal-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: modal-production
    env:
      MODAL_TRACEBACK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r cloud/requirements.txt
      - name: Check deployment credentials
        run: |
          test -n "$MODAL_TOKEN_ID" || { echo 'Missing MODAL_TOKEN_ID repository secret'; exit 1; }
          test -n "$MODAL_TOKEN_SECRET" || { echo 'Missing MODAL_TOKEN_SECRET repository secret'; exit 1; }
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      - run: modal deploy -m cloud.modal_app
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      - name: Verify private cloud connectivity
        run: modal run -m cloud.modal_app::verify_connectivity
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
